name: Update listening cards

on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_music.py
      - .github/workflows/music.yml

permissions:
  contents: read

concurrency:
  group: profile-music
  cancel-in-progress: false

jobs:
  music:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build cards from public ListenBrainz data
        run: python scripts/update_music.py
      - name: Commit updated cards
        run: |
          git add assets/music-light.svg assets/music-dark.svg assets/music-mobile-light.svg assets/music-mobile-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh listening cards'
          git pull --rebase origin main
          git push origin HEAD:main
